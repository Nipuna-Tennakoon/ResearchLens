[project]
name = "researchlens"
version = "0.1.0"
description = "RAG CLI for question answering over a folder of research papers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.3.18",
    "langchain-openai>=1.6.0",
    "llama-index>=0.14.24",
    "llama-index-embeddings-google-genai>=0.6.0",
    "llama-index-embeddings-huggingface>=0.8.0",
    "llama-index-readers-file>=0.6.0",
    "matplotlib>=3.11.2",
    "pymilvus>=3.0.1",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.3",
    "rich>=13.7.0",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=6.0.1",
    "typer>=0.12.0",
]

[project.scripts]
researchlens = "researchlens.cli:main"

[project.optional-dependencies]
notebooks = ["ipykernel>=7.3.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/researchlens"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = ["slow: needs the real embedding model downloaded (run with -m slow)"]
